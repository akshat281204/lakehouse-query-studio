name: lakehouse-query-studio

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lakehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (run make up to generate .env)}
      POSTGRES_DB: ${POSTGRES_DB:-lakehouse}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lakehouse} -d ${POSTGRES_DB:-lakehouse}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # S3-compatible object store. The community MinIO images are no longer
  # published (the minio/minio repositories are gone), so the default local
  # store is SeaweedFS. The apps speak plain S3 (SigV4, path-style) and keep the
  # historical MINIO_* variable names; any S3-compatible store works by pointing
  # MINIO_ENDPOINT/MINIO_ACCESS_KEY/MINIO_SECRET_KEY at it. The credentials come
  # from .env via the gitignored .s3-config.json that `make up` generates.
  s3:
    image: chrislusf/seaweedfs:4.05
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data", "-ip.bind=0.0.0.0"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - ./.s3-config.json:/etc/seaweedfs/s3.json:ro
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8333 && wget -q -O /dev/null http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/api"]
    environment:
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      SHUTDOWN_TIMEOUT: 10s
      POSTGRES_URL: postgres://${POSTGRES_USER:-lakehouse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lakehouse}?sslmode=disable
      MINIO_ENDPOINT: s3:8333
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-lakehouse}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-lakehouse}
      MINIO_USE_SSL: "false"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/worker"]
    # DuckDB's memory_limit does not bound every allocation (a single huge
    # string value is outside it), so the container limit is the real memory
    # backstop for query execution. Keep DUCKDB_MEMORY * QUERY_WORKERS below it.
    mem_limit: ${WORKER_MEM_LIMIT:-6g}
    environment:
      DUCKDB_MEMORY: ${DUCKDB_MEMORY:-2GiB}
      QUERY_WORKERS: ${QUERY_WORKERS:-2}
      # Worker /metrics: reachable on the Compose network only (not published).
      METRICS_ADDR: ":9100"
      EXPORT_TTL: ${EXPORT_TTL:-24h}
      HISTORY_RETENTION: ${HISTORY_RETENTION:-720h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      POSTGRES_URL: postgres://${POSTGRES_USER:-lakehouse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lakehouse}?sslmode=disable
      MINIO_ENDPOINT: s3:8333
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-lakehouse}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-lakehouse}
      MINIO_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_started

  # --- Service operations (opt-in): docker compose --profile ops up -d ---------
  # Separate from the user-facing SQL dashboard. Both bind to loopback only.
  prometheus:
    profiles: ["ops"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
      - worker

  grafana:
    profiles: ["ops"]
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  s3data:
