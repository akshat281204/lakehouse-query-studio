# Scrapes the API and the worker over the private Compose network. Neither
# metrics endpoint is published to the host. The Host header Prometheus sends
# (api:8080, worker:9100) is on the services' allowlists by default.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: lakehouse-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
  - job_name: lakehouse-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]
  # If API_TOKEN is set, add to each job:
  #   authorization: { type: Bearer, credentials_file: /run/secrets/api_token }
