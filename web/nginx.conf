server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy to the API service so the static dashboard never needs
    # object-store credentials or a token in the bundle.
    location /api/ {
        proxy_pass http://api:8080;
        # $http_host keeps the port; the API's Host allowlist matches host:port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        proxy_pass http://api:8080;
    }

    location = /readyz {
        proxy_pass http://api:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
